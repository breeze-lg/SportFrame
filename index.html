<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f6f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>模糊画框生成器 · Blur Frame Poster</title>
<style>
  :root{
    --bg:#f5f6f7; --panel:#ffffff; --line:#e3e6e8; --text:#1d2124; --sub:#6b757c;
    --accent:#0e5c6b; --accent-soft:#edf3f4;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
    height:100vh; height:100dvh;
    -webkit-text-size-adjust:100%;
  }
  .app{display:flex;height:100%}

  /* ---------- sidebar ---------- */
  .side{
    width:330px;flex:0 0 330px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .side header{padding:18px 18px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:5}
  .side h1{margin:0;font-size:15px;letter-spacing:.3px}
  .side h1 span{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:3px;letter-spacing:1.2px}
  .grp{padding:14px 18px;border-bottom:1px solid var(--line)}
  .grp h2{margin:0 0 10px;font-size:11px;color:var(--sub);letter-spacing:1.4px;font-weight:700}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:9px 0;font-size:12.5px}
  .row label{color:#3a4247;white-space:nowrap}
  .row output{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;min-width:38px;text-align:right}
  input[type=range]{width:100%;accent-color:var(--accent);height:28px;background:transparent;-webkit-appearance:none;appearance:none}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#dfe4e6}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;
    border:2px solid var(--accent);margin-top:-9px;box-shadow:0 1px 4px rgba(0,0,0,.2);
  }
  select,input[type=text]{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;
    background:#fff;color:var(--text);font-family:inherit;-webkit-appearance:none;appearance:none;
  }
  select{
    background-image:linear-gradient(45deg,transparent 50%,#8b9599 50%),linear-gradient(135deg,#8b9599 50%,transparent 50%);
    background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;
    background-size:5px 5px;background-repeat:no-repeat;
  }
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
  input[type=color]{width:52px;height:30px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
  .drop{
    border:1.5px dashed #c8cfd3;border-radius:10px;padding:18px 10px;text-align:center;
    font-size:13px;color:var(--sub);cursor:pointer;transition:.15s;background:#fbfcfc;
  }
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

  /* chips (templates) */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;
    font-size:12px;color:#3a4247;cursor:pointer;transition:.15s;user-select:none;white-space:nowrap;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .x{margin-left:7px;opacity:.5;font-size:13px;font-weight:700}
  button.mini{
    width:100%;flex:none;padding:9px;font-size:12.5px;margin-top:9px;color:var(--accent);
    border-style:dashed;border-radius:9px;
  }
  .cap{font-size:11px;color:var(--sub);margin:12px 0 7px;letter-spacing:.4px}

  .btns{
    display:flex;gap:8px;padding:12px 18px;padding-bottom:calc(12px + var(--safe-b));
    position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:6;
  }
  button{
    flex:1;padding:12px;border-radius:9px;border:1px solid var(--line);background:#fff;
    font-size:13.5px;font-family:inherit;cursor:pointer;color:var(--text);transition:.15s;white-space:nowrap;
  }
  button:active{transform:scale(.98)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .hint{font-size:11px;color:var(--sub);line-height:1.7;padding:0 18px 18px}
  .kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:10.5px;background:#fafbfb}

  /* ---------- stage ---------- */
  .stage{
    flex:1;display:flex;align-items:center;justify-content:center;position:relative;
    background:
      linear-gradient(45deg,#eceff0 25%,transparent 25%,transparent 75%,#eceff0 75%),
      linear-gradient(45deg,#eceff0 25%,#f7f8f9 25%,#f7f8f9 75%,#eceff0 75%);
    background-size:22px 22px;background-position:0 0,11px 11px;overflow:hidden;
  }
  canvas#cv{
    max-width:92%;max-height:92%;box-shadow:0 18px 50px rgba(0,0,0,.22);border-radius:2px;
    cursor:grab;touch-action:none;
  }
  canvas#cv.dragging{cursor:grabbing}
  .fab{
    position:absolute;top:calc(10px + var(--safe-t));right:10px;z-index:7;
    width:38px;height:38px;padding:0;flex:none;border-radius:50%;
    background:rgba(255,255,255,.92);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  .toast{
    position:absolute;bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%);
    background:rgba(29,33,36,.9);color:#fff;font-size:12.5px;padding:8px 16px;border-radius:20px;
    opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:90%;
  }
  .toast.show{opacity:1}

  /* iOS save sheet */
  .sheet{
    position:fixed;inset:0;background:rgba(20,24,26,.88);z-index:50;display:none;
    flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px;
  }
  .sheet.show{display:flex}
  .sheet img{max-width:100%;max-height:72vh;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .sheet p{color:#fff;font-size:13px;margin:0;text-align:center;line-height:1.6}
  .sheet button{flex:none;padding:10px 26px;border-radius:20px}

  /* ---------- desktop: control panel on the LEFT ---------- */
  @media (min-width:901px){
    .side{order:-1}
  }

  /* ---------- mobile ---------- */
  @media (max-width:900px){
    .app{flex-direction:column}
    .stage{flex:0 0 auto;height:44vh;height:44dvh;min-height:230px;padding:10px}
    .side{
      width:100%;flex:1 1 auto;border-right:none;border-top:1px solid var(--line);
      border-radius:14px 14px 0 0;margin-top:-12px;position:relative;z-index:3;
      box-shadow:0 -6px 18px rgba(0,0,0,.06);
    }
    .side header{padding:12px 18px 10px}
    .side h1{font-size:14px}
    .side h1 span{display:none}
    canvas#cv{max-width:96%;max-height:96%}
    .grp{padding:12px 16px}
    .row{margin:7px 0}
    .drop{padding:14px 10px}
    .hint{display:none}
  }
  body.focus .side{display:none}
  body.focus .stage{height:100dvh;flex:1 1 100%;min-height:0}
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <button class="fab" id="fab" title="全屏预览 / 显示控件">⤢</button>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="side">
    <header>
      <h1>模糊画框生成器<span>BLUR FRAME POSTER</span></h1>
    </header>

    <div class="grp">
      <h2>01 · 布局模板</h2>
      <div class="chips" id="layoutChips"></div>
      <div class="cap">我的模板</div>
      <div class="chips" id="customChips"></div>
      <button class="mini" id="saveTpl">＋ 把当前设置存为模板</button>
    </div>

    <div class="grp">
      <h2>02 · 图片</h2>
      <div class="drop" id="drop">点击上传图片<br><small>也可拖入 / 粘贴</small></div>
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <div class="grp">
      <h2>03 · 画布</h2>
      <div class="row"><label>比例</label>
        <select id="ratio" style="width:52%">
          <option value="orig">原始比例</option>
          <option value="1:1">1 : 1</option>
          <option value="4:5" selected>4 : 5</option>
          <option value="3:4">3 : 4</option>
          <option value="2:3">2 : 3</option>
          <option value="3:2">3 : 2</option>
          <option value="9:16">9 : 16</option>
          <option value="16:9">16 : 9</option>
        </select>
      </div>
      <div class="row"><label>输出长边</label>
        <select id="outsize" style="width:52%">
          <option value="1080">1080 px</option>
          <option value="1440" selected>1440 px</option>
          <option value="2048">2048 px</option>
          <option value="2560">2560 px</option>
        </select>
      </div>
    </div>

    <div class="grp">
      <h2>04 · 背景</h2>
      <div class="row"><label>模糊</label><output id="o_blur">28</output></div>
      <input type="range" id="blur" min="0" max="80" value="28">
      <div class="row"><label>暗化</label><output id="o_dark">28</output></div>
      <input type="range" id="dark" min="0" max="85" value="28">
      <div class="row"><label>背景缩放</label><output id="o_bgzoom">118%</output></div>
      <input type="range" id="bgzoom" min="100" max="220" value="118">
    </div>

    <div class="grp">
      <h2>05 · 画框</h2>
      <div class="row"><label>画框大小</label><output id="o_scale">72%</output></div>
      <input type="range" id="scale" min="25" max="100" value="72">
      <div class="row"><label>圆角</label><output id="o_radius">8</output></div>
      <input type="range" id="radius" min="0" max="80" value="8">
      <div class="row"><label>白边（四周）</label><output id="o_border">0</output></div>
      <input type="range" id="border" min="0" max="60" value="0">
      <div class="row"><label>底部白边</label><output id="o_borderB">0</output></div>
      <input type="range" id="borderB" min="0" max="140" value="0">
      <div class="row"><label>阴影</label><output id="o_shadow">45</output></div>
      <input type="range" id="shadow" min="0" max="90" value="45">
      <div class="row"><label>横向位置</label><output id="o_ox">0</output></div>
      <input type="range" id="ox" min="-50" max="50" value="0">
      <div class="row"><label>纵向位置</label><output id="o_oy">0</output></div>
      <input type="range" id="oy" min="-50" max="50" value="0">
    </div>

    <div class="grp">
      <h2>06 · 文字模板</h2>
      <div class="chips" id="textChips"></div>

      <div class="cap">文字内容</div>
      <div class="row"><label>显示文字</label><input type="checkbox" id="t_on" checked></div>
      <div style="margin:9px 0"><input type="text" id="t_title" value="距离 122.33 Km" placeholder="主标题"></div>
      <div style="margin:9px 0"><input type="text" id="t_sub" value="以梦为马" placeholder="副标题"></div>
      <div style="margin:9px 0"><input type="text" id="t_sign" value="@Breeze" placeholder="署名"></div>
      <div class="row"><label>位置</label>
        <select id="t_pos" style="width:52%">
          <option value="bottom" selected>底部</option>
          <option value="top">顶部</option>
          <option value="center">居中</option>
          <option value="frame">画框下白边</option>
        </select>
      </div>
      <div class="row"><label>字号</label><output id="o_tsize">34</output></div>
      <input type="range" id="tsize" min="10" max="70" value="34">
      <div class="row"><label>描边</label><input type="checkbox" id="t_stroke" checked></div>
      <div class="row"><label>文字颜色</label><input type="color" id="t_color" value="#ffffff"></div>
    </div>

    <div class="hint">
      先点模板，再换图/微调。预览区可 <span class="kbd">拖拽</span> 移动、<span class="kbd">双指/滚轮</span> 缩放。<br>
      导出为 2× 高清 PNG。推荐 Chrome / Safari。
    </div>

    <div class="btns">
      <button id="reset" style="flex:0 0 32%">重置</button>
      <button class="primary" id="dl">保存 PNG</button>
    </div>
  </aside>
</div>

<div class="sheet" id="sheet">
  <img id="sheetImg" alt="导出结果">
  <p>长按图片 → 存储到相册<br>（或点右上角「分享」保存）</p>
  <button id="sheetClose">关闭</button>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const cv = $('cv');
  let ctx = cv.getContext('2d');   // mutable so export can retarget it

  /* =================== templates =================== */
  // 布局模板：只改"样子"（比例/模糊/画框/文字位置与样式），不改文字内容
  const LAYOUTS = [
    { n:'经典海报', ratio:'4:5', blur:28, dark:30, bgzoom:118, scale:72, radius:8,  border:0,  borderB:0,   shadow:45, ox:0,  oy:0,  tPos:'bottom', tSize:34, tStroke:true,  tColor:'#ffffff' },
    { n:'拍立得',   ratio:'4:5', blur:36, dark:14, bgzoom:134, scale:64, radius:0,  border:16, borderB:104, shadow:38, ox:0,  oy:-8, tPos:'frame',  tSize:26, tStroke:false, tColor:'#2b2b2b' },
    { n:'杂志封面', ratio:'4:5', blur:46, dark:54, bgzoom:130, scale:58, radius:0,  border:0,  borderB:0,   shadow:24, ox:0,  oy:0,  tPos:'top',    tSize:46, tStroke:true,  tColor:'#ffffff' },
    { n:'电影感',   ratio:'16:9',blur:62, dark:64, bgzoom:148, scale:62, radius:4,  border:0,  borderB:0,   shadow:55, ox:0,  oy:0,  tPos:'bottom', tSize:24, tStroke:false, tColor:'#f4f2ee' },
    { n:'明信片',   ratio:'3:2', blur:40, dark:12, bgzoom:126, scale:72, radius:2,  border:18, borderB:74,  shadow:30, ox:0,  oy:-6, tPos:'frame',  tSize:28, tStroke:false, tColor:'#333333' },
    { n:'极简',     ratio:'1:1', blur:48, dark:6,  bgzoom:126, scale:56, radius:26, border:0,  borderB:0,   shadow:20, ox:0,  oy:0,  tPos:'bottom', tSize:28, tStroke:false, tColor:'#ffffff', off:true },
    { n:'社媒方形', ratio:'1:1', blur:30, dark:32, bgzoom:120, scale:78, radius:10, border:0,  borderB:0,   shadow:44, ox:0,  oy:0,  tPos:'bottom', tSize:32, tStroke:true,  tColor:'#ffffff' },
    { n:'竖版故事', ratio:'9:16',blur:34, dark:36, bgzoom:132, scale:60, radius:14, border:0,  borderB:0,   shadow:40, ox:0,  oy:0,  tPos:'bottom', tSize:30, tStroke:true,  tColor:'#ffffff' }
  ];

  // 文字模板：只改文字与文字排布
  const TEXTS = [
    { n:'骑行里程', title:'距离 122.33 Km', sub:'以梦为马',        sign:'@Breeze',    tPos:'bottom', tSize:34 },
    { n:'旅行日记', title:'City Walk',      sub:'城市漫步 · 第 7 天', sign:'2026.10.03', tPos:'bottom', tSize:30 },
    { n:'一句话',   title:'光落在该落的地方', sub:'',               sign:'@Breeze',    tPos:'bottom', tSize:30 },
    { n:'数据海报', title:'42.195 KM',      sub:'用时 3:58:26',    sign:'MARATHON',   tPos:'bottom', tSize:40 },
    { n:'极简日期', title:'2026.10.03',     sub:'',                sign:'',           tPos:'bottom', tSize:26 },
    { n:'无文字',   off:true }
  ];

  const state = {
    img: null, imgName: '',
    W: 1080, H: 1350, ratio:'4:5',
    blur:28, dark:28, bgzoom:118, scale:72, radius:8, border:0, borderB:0, shadow:45,
    ox:0, oy:0,
    tOn:true, tTitle:'距离 122.33 Km', tSub:'以梦为马', tSign:'@Breeze',
    tPos:'bottom', tSize:34, tStroke:true, tColor:'#ffffff'
  };

  /* ---------- helpers ---------- */
  function rr(c,x,y,w,h,r){
    r = Math.max(0, Math.min(r, w/2, h/2));
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,   x+w,y+h, r);
    c.arcTo(x+w,y+h, x,y+h,   r);
    c.arcTo(x,y+h,   x,y,     r);
    c.arcTo(x,y,     x+w,y,   r);
    c.closePath();
  }
  function cover(iw,ih,boxW,boxH,zoom){
    const s = Math.max(boxW/iw, boxH/ih) * (zoom||1);
    return { s, w: iw*s, h: ih*s };
  }
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800);
  }
  function parseRatio(v){
    if(v === 'orig') return state.img ? state.img.width/state.img.height : 4/5;
    const p = v.split(':');
    return Number(p[0])/Number(p[1]);
  }
  function computeCanvasSize(){
    const r = parseRatio(state.ratio);
    const long = Number($('outsize').value);
    let W,H;
    if(r >= 1){ W = long; H = Math.round(long/r); }
    else { H = long; W = Math.round(long*r); }
    state.W = W; state.H = H;
    cv.width = W; cv.height = H;
  }

  // fallback blur for engines without ctx.filter: downscale then upscale
  function cheapBlur(c, img, x, y, w, h, radius){
    const div = Math.max(4, radius/2);
    const tw = Math.max(8, Math.round(w/div)), th = Math.max(8, Math.round(h/div));
    const t = document.createElement('canvas'); t.width = tw; t.height = th;
    t.getContext('2d').drawImage(img, 0, 0, tw, th);
    c.imageSmoothingEnabled = true;
    c.drawImage(t, x, y, w, h);
  }

  /* ---------- drawing (k = scale factor) ---------- */
  function draw(k){
    const W = state.W*k, H = state.H*k;
    let F = null;                      // frame geometry, reused by the text layer
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);

    // ---- background ----
    if(state.img){
      const pad = state.blur*k*3 + 8;
      const bg = cover(state.img.width, state.img.height, W+pad*2, H+pad*2, state.bgzoom/100);
      const bx = (W+pad*2 - bg.w)/2 - pad, by = (H+pad*2 - bg.h)/2 - pad;
      ctx.save();
      if(ctx.filter !== undefined){
        ctx.filter = 'blur(' + (state.blur*k) + 'px)';
        ctx.drawImage(state.img, bx, by, bg.w, bg.h);
      } else {
        cheapBlur(ctx, state.img, bx, by, bg.w, bg.h, state.blur*k);
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(0,0,0,' + (state.dark/100) + ')';
      ctx.fillRect(0,0,W,H);
    } else {
      ctx.fillStyle = '#2a3238'; ctx.fillRect(0,0,W,H);
    }

    // ---- foreground frame ----
    if(state.img){
      const iw = state.img.width, ih = state.img.height, iAsp = iw/ih;
      const boxW = W * state.scale/100, boxH = H * state.scale/100;
      let fw = boxW, fh = fw/iAsp;
      if(fh > boxH){ fh = boxH; fw = fh*iAsp; }
      const cx = W/2 + (state.ox/100)*W*0.35;
      const cy = H/2 + (state.oy/100)*H*0.35;
      const fx = cx - fw/2, fy = cy - fh/2;
      const pad = state.border*k, padB = state.borderB*k;
      F = { fx:fx, fy:fy, fw:fw, fh:fh, pad:pad, padB:padB, k:k, W:W, H:H };
      window.__F = F;

      // white mat — inset ~1px so it can never peek out from under the photo
      const ins = 1*k;
      const mw = Math.max(1, fw + pad*2 - ins*2);
      const mh = Math.max(1, fh + pad*2 + padB - ins*2);
      ctx.save();
      const sh = state.shadow/100;
      if(sh > 0){
        ctx.shadowColor = 'rgba(0,0,0,' + (0.75*sh).toFixed(3) + ')';
        ctx.shadowBlur = 60*k*sh; ctx.shadowOffsetY = 16*k*sh;
      }
      ctx.fillStyle = '#ffffff';
      rr(ctx, fx-pad+ins, fy-pad+ins, mw, mh, Math.max(0, state.radius*k + pad - ins));
      ctx.fill();
      ctx.restore();

      // photo, clipped to rounded rect; drawn 1px oversized so the clip is fully covered
      ctx.save();
      rr(ctx, fx, fy, fw, fh, state.radius*k);
      ctx.clip();
      const g = 1*k;
      const fg = cover(iw, ih, fw + g*2, fh + g*2, 1);
      ctx.drawImage(state.img, fx - g + (fw + g*2 - fg.w)/2, fy - g + (fh + g*2 - fg.h)/2, fg.w, fg.h);
      ctx.restore();
    }

    // ---- text ----
    if(state.tOn && state.img){
      const FONT = '-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif';
      const fs = state.tSize/100 * H * 0.20;
      const col = state.tColor, maxW = W*0.86;

      const draw1 = (txt, size, weight, y, alpha, align, x) => {
        if(!txt) return;
        let s = size;
        ctx.textAlign = align || 'center';
        ctx.font = weight + ' ' + s + 'px ' + FONT;
        const limit = align === 'right' ? maxW*0.5 : maxW;
        const w = ctx.measureText(txt).width;
        if(w > limit){ s = s*(limit/w); ctx.font = weight + ' ' + s + 'px ' + FONT; }
        ctx.globalAlpha = alpha;
        if(state.tStroke){
          ctx.lineWidth = s*0.14; ctx.strokeStyle = 'rgba(0,0,0,.55)';
          ctx.lineJoin = 'round'; ctx.strokeText(txt, x, y);
        }
        ctx.fillStyle = col; ctx.fillText(txt, x, y);
        ctx.globalAlpha = 1;
      };

      ctx.save();
      ctx.textBaseline = 'alphabetic';
      const cxT = W/2;

      if(state.tPos === 'frame' && F && F.padB > 4*k){
        // text lives inside the white band under the photo
        const bandTop = F.fy + F.fh + F.pad;
        const bandH = F.padB;
        const tsz = Math.min(fs, bandH*0.46);
        const fcx = F.fx + F.fw/2;                 // centre on the FRAME, not the canvas
        const frx = F.fx + F.fw + F.pad - 6*k;     // right edge, kept inside the mat
        if(state.tSub) draw1(state.tSub, tsz*0.55, '400', bandTop + bandH*0.28, .75, 'center', fcx);
        draw1(state.tTitle, tsz, '600', bandTop + bandH*0.70, 1, 'center', fcx);
        if(state.tSign) draw1(state.tSign, tsz*0.42, '500', bandTop + bandH*0.70, .7, 'right', frx);
      } else {
        let baseY;
        if(state.tPos === 'top') baseY = H*0.10;
        else if(state.tPos === 'center') baseY = H*0.50;
        else baseY = H*0.90;
        const gap = fs*1.5;
        if(state.tPos === 'center'){
          draw1(state.tTitle, fs, '700', baseY - gap*0.5, 1, 'center', cxT);
          draw1(state.tSub,   fs*0.42, '500', baseY + gap*0.5, .92, 'center', cxT);
        } else if(state.tPos === 'top'){
          draw1(state.tTitle, fs, '700', baseY, 1, 'center', cxT);
          draw1(state.tSub,   fs*0.42, '500', baseY + fs*1.15, .92, 'center', cxT);
        } else {
          draw1(state.tSub,   fs*0.42, '500', baseY - fs*1.35, .92, 'center', cxT);
          draw1(state.tTitle, fs, '700', baseY, 1, 'center', cxT);
        }
        if(state.tSign) draw1(state.tSign, Math.max(fs*0.30, W*0.015), '500', H - H*0.035, .78, 'right', W - H*0.045);
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function render(){
    computeCanvasSize();
    draw(1);
  }

  /* ---------- loading ---------- */
  function loadFile(f){
    if(!f || !f.type || f.type.indexOf('image/') !== 0) return;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      state.img = im; state.imgName = (f.name||'').replace(/\.[^.]+$/,'');
      render(); toast('已载入 ' + im.width + '×' + im.height);
    };
    im.onerror = () => toast('图片读取失败');
    im.src = url;
  }

  /* ---------- wire controls ---------- */
  const RANGES = ['blur','dark','bgzoom','scale','radius','border','borderB','shadow','ox','oy','tsize'];
  RANGES.forEach(id => {
    const el = $(id);
    el.addEventListener('input', () => {
      state[id] = Number(el.value);
      const o = $('o_'+id);
      if(o) o.textContent = (id === 'bgzoom' || id === 'scale') ? el.value + '%' : el.value;
      render();
    });
  });

  function syncUI(){
    RANGES.forEach(id => {
      const el = $(id); el.value = state[id];
      const o = $('o_'+id);
      if(o) o.textContent = (id === 'bgzoom' || id === 'scale') ? state[id] + '%' : state[id];
    });
    $('ratio').value = state.ratio;
    $('t_on').checked = state.tOn;
    $('t_stroke').checked = state.tStroke;
    $('t_pos').value = state.tPos;
    $('t_color').value = state.tColor;
    $('t_title').value = state.tTitle;
    $('t_sub').value = state.tSub;
    $('t_sign').value = state.tSign;
  }

  $('ratio').addEventListener('change', e => { state.ratio = e.target.value; render(); });
  $('outsize').addEventListener('change', render);
  $('t_on').addEventListener('change', e => { state.tOn = e.target.checked; render(); });
  $('t_stroke').addEventListener('change', e => { state.tStroke = e.target.checked; render(); });
  $('t_pos').addEventListener('change', e => { state.tPos = e.target.value; render(); });
  $('t_color').addEventListener('input', e => { state.tColor = e.target.value; render(); });
  $('t_title').addEventListener('input', e => { state.tTitle = e.target.value; render(); });
  $('t_sub').addEventListener('input', e => { state.tSub = e.target.value; render(); });
  $('t_sign').addEventListener('input', e => { state.tSign = e.target.value; render(); });

  /* ---------- template application ---------- */
  let activeLayout = -1, activeCustom = -1;
  function applyLayout(i){
    const L = LAYOUTS[i];
    ['ratio','blur','dark','bgzoom','scale','radius','border','borderB','shadow','ox','oy','tPos','tSize','tStroke','tColor']
      .forEach(key => { if(L[key] !== undefined) state[key] = L[key]; });
    if(L.off !== undefined) state.tOn = !L.off;
    activeLayout = i; activeCustom = -1;
    syncUI(); renderChips(); render();
    toast('模板：' + L.n);
  }
  function applyText(i){
    const T = TEXTS[i];
    if(T.off){ state.tOn = false; }
    else {
      state.tOn = true;
      state.tTitle = T.title; state.tSub = T.sub; state.tSign = T.sign;
      state.tPos = T.tPos;    state.tSize = T.tSize;
    }
    syncUI(); renderChips(); render();
    toast('文字：' + T.n);
  }

  /* ---------- custom templates (localStorage) ---------- */
  const LSK = 'bfp_tpl_v1';
  function loadCustom(){
    try{ return JSON.parse(localStorage.getItem(LSK) || '[]'); }catch(e){ return []; }
  }
  function saveCustom(list){
    try{ localStorage.setItem(LSK, JSON.stringify(list)); }catch(e){ toast('保存失败'); }
  }
  function snapshot(){
    const s = {};
    ['ratio','blur','dark','bgzoom','scale','radius','border','borderB','shadow','ox','oy',
     'tOn','tTitle','tSub','tSign','tPos','tSize','tStroke','tColor'].forEach(k => s[k] = state[k]);
    return s;
  }
  function applySnapshot(s){
    Object.keys(s).forEach(k => { if(s[k] !== undefined) state[k] = s[k]; });
    activeLayout = -1; activeCustom = -1;
    syncUI(); renderChips(); render();
  }

  function renderChips(){
    const lc = $('layoutChips'); lc.innerHTML = '';
    LAYOUTS.forEach((L, i) => {
      const b = document.createElement('div');
      b.className = 'chip' + (i === activeLayout ? ' on' : '');
      b.textContent = L.n;
      b.addEventListener('click', () => applyLayout(i));
      lc.appendChild(b);
    });

    const tc = $('textChips'); tc.innerHTML = '';
    TEXTS.forEach((T, i) => {
      const b = document.createElement('div');
      b.className = 'chip';
      b.textContent = T.n;
      b.addEventListener('click', () => applyText(i));
      tc.appendChild(b);
    });

    const cc = $('customChips'); cc.innerHTML = '';
    const list = loadCustom();
    if(!list.length){
      const d = document.createElement('span');
      d.style.cssText = 'font-size:11px;color:#a8b2b6';
      d.textContent = '（暂无，调好后点下面按钮保存）';
      cc.appendChild(d);
    }
    list.forEach((t, i) => {
      const b = document.createElement('div');
      b.className = 'chip' + (i === activeCustom ? ' on' : '');
      b.textContent = t.name;
      b.addEventListener('click', () => { activeCustom = i; activeLayout = -1; applySnapshot(t.s); toast('模板：' + t.name); });
      const x = document.createElement('span');
      x.className = 'x'; x.textContent = '×';
      x.addEventListener('click', ev => {
        ev.stopPropagation();
        const l = loadCustom(); l.splice(i,1); saveCustom(l);
        activeCustom = -1; renderChips();
      });
      b.appendChild(x);
      cc.appendChild(b);
    });
  }

  $('saveTpl').addEventListener('click', () => {
    const name = (prompt('模板名称', '我的模板 ' + (loadCustom().length + 1)) || '').trim();
    if(!name) return;
    const l = loadCustom(); l.push({ name: name, s: snapshot() });
    saveCustom(l); renderChips(); toast('已保存模板：' + name);
  });

  /* ---------- image input ---------- */
  $('drop').addEventListener('click', ()=> $('file').click());
  $('file').addEventListener('change', e => loadFile(e.target.files[0]));

  document.addEventListener('paste', e => {
    const items = (e.clipboardData || {}).items || [];
    for(const it of items){
      if(it.type && it.type.indexOf('image/') === 0){ loadFile(it.getAsFile()); return; }
    }
  });

  // fullscreen preview toggle
  $('fab').addEventListener('click', () => document.body.classList.toggle('focus'));

  const stage = $('stage');
  ['dragenter','dragover'].forEach(ev => stage.addEventListener(ev, e => {
    e.preventDefault(); $('drop').classList.add('over');
  }));
  ['dragleave','drop'].forEach(ev => stage.addEventListener(ev, e => {
    e.preventDefault(); $('drop').classList.remove('over');
  }));
  stage.addEventListener('drop', e => { if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

  /* ---------- touch / pointer: drag + pinch ---------- */
  const pts = new Map();
  let lastDist = 0;
  cv.addEventListener('pointerdown', e => {
    if(!state.img) return;
    cv.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    cv.classList.add('dragging');
    if(pts.size === 2){
      const a = Array.from(pts.values());
      lastDist = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    }
  });
  cv.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(pts.size >= 2){
      const a = Array.from(pts.values());
      const dist = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
      if(lastDist > 0){
        state.scale = Math.max(25, Math.min(100, state.scale * (dist/lastDist)));
        $('scale').value = state.scale; $('o_scale').textContent = Math.round(state.scale)+'%';
        render();
      }
      lastDist = dist;
      return;
    }
    if(!state.img) return;
    const r = cv.getBoundingClientRect();
    state.ox = Math.max(-50, Math.min(50, state.ox + (e.clientX-prev.x)/r.width*100*0.9));
    state.oy = Math.max(-50, Math.min(50, state.oy + (e.clientY-prev.y)/r.height*100*0.9));
    $('ox').value = state.ox; $('o_ox').textContent = Math.round(state.ox);
    $('oy').value = state.oy; $('o_oy').textContent = Math.round(state.oy);
    render();
  });
  const endPt = e => {
    pts.delete(e.pointerId);
    if(pts.size < 2) lastDist = 0;
    if(pts.size === 0) cv.classList.remove('dragging');
  };
  ['pointerup','pointercancel'].forEach(ev => cv.addEventListener(ev, endPt));

  cv.addEventListener('wheel', e => {
    if(!state.img) return;
    e.preventDefault();
    state.scale = Math.max(25, Math.min(100, state.scale - e.deltaY*0.05));
    $('scale').value = state.scale; $('o_scale').textContent = Math.round(state.scale)+'%';
    render();
  }, {passive:false});

  /* ---------- export ---------- */
  function renderExport(K){
    K = K || 2;
    const out = document.createElement('canvas');
    out.width = state.W*K; out.height = state.H*K;
    const home = ctx;
    ctx = out.getContext('2d');
    draw(K);
    ctx = home;
    return out;
  }
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  $('dl').addEventListener('click', () => {
    if(!state.img){ toast('请先载入图片'); return; }
    const out = renderExport(2);
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');

    if(isIOS){
      try{
        $('sheetImg').src = out.toDataURL('image/png');
        $('sheet').classList.add('show');
      }catch(err){ toast('导出失败：' + err.message); }
      return;
    }
    out.toBlob(b => {
      if(!b){ toast('导出失败'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'blurframe_' + out.width + 'x' + out.height + '_' + stamp + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
      toast('已保存 ' + out.width + '×' + out.height + ' PNG');
    }, 'image/png');
  });
  $('sheetClose').addEventListener('click', ()=> $('sheet').classList.remove('show'));
  $('sheet').addEventListener('click', e => { if(e.target === $('sheet')) $('sheet').classList.remove('show'); });

  $('reset').addEventListener('click', () => {
    applyLayout(0);
    state.tTitle = '距离 122.33 Km'; state.tSub = '以梦为马'; state.tSign = '@Breeze';
    state.tOn = true; syncUI(); render(); toast('已重置');
  });

  /* ---------- optional: ?img=<url|file path> ---------- */
  (function(){
    const v = new URLSearchParams(location.search).get('img');
    if(!v) return;
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => {
      state.img = im;
      const t = new URLSearchParams(location.search).get('tpl');
      if(t !== null && t !== '' && LAYOUTS[parseInt(t,10)]){ applyLayout(parseInt(t,10)); }
      else { render(); toast('已载入'); }
    };
    im.onerror = () => toast('图片加载失败');
    im.src = v;
  })();

  /* ---------- demo / self-test: ?demo=1 [&selftest=1] ---------- */
  const qs = new URLSearchParams(location.search);
  if(qs.get('demo') === '1'){
    const d = document.createElement('canvas');
    d.width = 1400; d.height = 1050;
    const c = d.getContext('2d');
    const g = c.createLinearGradient(0,0,1400,1050);
    g.addColorStop(0,'#c9531f'); g.addColorStop(.45,'#e8a13c'); g.addColorStop(1,'#4a6b3a');
    c.fillStyle = g; c.fillRect(0,0,1400,1050);
    for(let i=0;i<70;i++){
      c.fillStyle = 'rgba('+(200+Math.random()*55|0)+','+(120+Math.random()*80|0)+','+(40+Math.random()*60|0)+',.5)';
      c.beginPath(); c.arc(Math.random()*1400, Math.random()*600, 8+Math.random()*40, 0, 7); c.fill();
    }
    c.fillStyle = 'rgba(60,70,50,.85)';
    c.beginPath(); c.moveTo(0,1050); c.lineTo(620,560); c.lineTo(780,560); c.lineTo(1400,1050); c.closePath(); c.fill();
    c.fillStyle = '#1e2a33';
    c.beginPath(); c.arc(700,430,46,0,7); c.fill();
    c.fillRect(660,470,80,150);
    const im = new Image();
    im.onload = () => {
      state.img = im;
      const tpl = qs.get('tpl');
      if(tpl !== null && tpl !== ''){
        const idx = parseInt(tpl, 10);
        if(!isNaN(idx) && LAYOUTS[idx]) applyLayout(idx); else render();
      } else render();

      if(qs.get('selftest') === '1'){
        const out = renderExport(1);
        out.style.cssText = 'max-width:38%;max-height:38%;position:absolute;top:12px;right:60px;box-shadow:0 8px 30px rgba(0,0,0,.35);border:2px solid #0e5c6b';
        $('stage').appendChild(out);
        document.title = 'EXPORT ' + out.width + 'x' + out.height;
      }
    };
    im.src = d.toDataURL();
  }

  /* ---------- boot ---------- */
  renderChips();
  syncUI();
  render();

  /* ---------- layout debug: ?debug=1 ---------- */
  if(qs.get('debug') === '1'){
    setTimeout(() => {
      const r = cv.getBoundingClientRect(), s = $('stage').getBoundingClientRect(), sd = document.querySelector('.side').getBoundingClientRect();
      const d = document.createElement('div');
      d.id = 'dbg'; d.style.position = 'fixed'; d.style.left = '-9999px';
      d.textContent = 'DBG|canvas=' + Math.round(r.x) + ',' + Math.round(r.y) + ',' + Math.round(r.width) + 'x' + Math.round(r.height) +
        '|stage=' + Math.round(s.x) + ',' + Math.round(s.y) + ',' + Math.round(s.width) + 'x' + Math.round(s.height) +
        '|side=' + Math.round(sd.x) + ',' + Math.round(sd.y) + ',' + Math.round(sd.width) + 'x' + Math.round(sd.height) +
        '|vw=' + innerWidth + '|vh=' + innerHeight + '|dpr=' + devicePixelRatio +
        '|chips=' + $('layoutChips').children.length + ',text=' + $('textChips').children.length +
        '|cvsize=' + state.W + 'x' + state.H +
        '|frame=' + (window.__F ? [window.__F.fx, window.__F.fy, window.__F.fw, window.__F.fh, window.__F.pad, window.__F.padB].map(v=>Math.round(v)).join(',') : 'none');
      document.body.appendChild(d);
    }, 400);
  }

  /* ---------- pixel self-check: ?pixcheck=1 (reads back the exported canvas) ---------- */
  if(qs.get('pixcheck') === '1'){
    setTimeout(() => {
      const out = renderExport(1);
      const c = out.getContext('2d');
      const F = window.__F;
      const parts = [];
      if(F){
        const x0 = Math.round(F.fx + 15), x1 = Math.round(F.fx + F.fw - 15);
        const frac = (y) => {
          const d = c.getImageData(x0, y, Math.max(1, x1 - x0), 1).data;
          let hit = 0, n = 0, lum = 0;
          for(let i = 0; i < d.length; i += 4){
            n++; lum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
            if(Math.min(d[i], d[i+1], d[i+2]) >= 200) hit++;
          }
          return (hit / Math.max(1, n)).toFixed(2) + '/' + Math.round(lum / Math.max(1, n));
        };
        const bot = Math.round(F.fy + F.fh);
        for(let y = bot - 6; y <= bot + 10; y++) parts.push('y' + y + ':' + frac(y));
        parts.push('BOTTOM=' + bot + ' pad=' + Math.round(F.pad) + ' padB=' + Math.round(F.padB));
        if(F.padB > 4){
          const ym = Math.round(F.fy + F.fh + F.pad + F.padB/2);
          parts.push('band@' + ym + ':' + frac(ym));
        }
      }
      const el = document.createElement('div');
      el.id = 'pix'; el.style.position = 'fixed'; el.style.left = '-9999px';
      el.textContent = 'PIX|' + parts.join(' | ');
      document.body.appendChild(el);
    }, 500);
  }
})();
</script>
</body>
</html>
