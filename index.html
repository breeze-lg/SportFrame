<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9E8E3">
<title>模糊画框</title>
<!--
  First paint, ahead of the stylesheet and ahead of every module: the theme
  lands on `documentElement` before the wall is painted. `src/ui/theme.ts` is a
  deferred module, so on its own it always loses that race — a visitor whose
  system prefers dark got a light wall first, and `app.css`'s .25s
  background-color transition turned the correction into a fade. Dark mode is a
  headline feature here and the wall is the material the whole design is made
  of; the first frame has to be right.

  This is the same decision `resolveTheme()` makes, on the same key
  `readStoredTheme()` reads (the two are pinned together by
  tests/unit/theme.test.ts, since a head script cannot import a module without
  becoming deferred — the defect it exists to fix). Module scripts do re-apply
  it, idempotently, once they run.
-->
<script>
(function () {
  var stored = null
  try {
    stored = localStorage.getItem('frame-app-theme')
  } catch (e) {
    /* Private modes and some webviews throw on access. The system preference
       is still a usable answer, so this must not end the script. */
  }
  try {
    var t = stored === 'light' || stored === 'dark'
      ? stored
      : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    document.documentElement.setAttribute('data-theme', t)
    document.documentElement.style.colorScheme = t
  } catch (e) {
    /* No theme: the module applies one a moment later, and the stylesheet's
       default is light. Never let this script take the page down with it. */
  }
})()
</script>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="dock">
    <!-- `#file` is `hidden`, so this div is the only way to a photo for a
         keyboard user: it needs a tab stop and a button role, and `wireInput`
         opens the input on Enter and Space as well as on click. -->
    <div class="drop" id="drop" tabindex="0" role="button">把照片放到墙上<small>点击选择，也可以拖进来或粘贴</small></div>
    <!-- A sibling of `.drop`, never a child of it: `wireInput` opens this input
         from `.drop`'s own click handler, so an input nested inside the zone
         would be clicked from within the dispatch of the click it caused —
         a cycle. -->
    <input type="file" id="file" accept="image/*" hidden>

    <div class="rail-h"><b>样式</b><span id="rail-info"></span></div>
    <div class="rail" id="rail"></div>
    <!-- The premium plaque (spec §10): it names the pack when a template is
         premium *and* locked, and v1 ships nothing gated, so it is wired and
         never shown. It carries its own `hidden` rather than being created on
         demand: the picker writes two properties on an element that is always
         in the dock, which is testable, where an element that appears and
         disappears is only observable while it is there. -->
    <div class="plaque-row" id="plaque" hidden></div>

    <!-- 文字 — one input per slot the current template prints (see
         `src/ui/fields.ts`). The row is built by the picker, not written here,
         because which slots exist is a property of the template: 留白 has no
         typography, and a field for a slot nothing draws is a control that
         accepts typing and changes nothing. The whole block, heading included,
         hides at zero fields — and it carries its own `[hidden]` rule in
         `app.css` for the same reason `.plaque-row` does: the block sets its
         own `display`, which would otherwise beat the UA's `[hidden]`. -->
    <div class="fields" id="fields" hidden>
      <div class="rail-h"><b>文字</b></div>
      <div class="field-row" id="field-row"></div>
    </div>

    <div class="acts">
      <!-- Secondary, not primary: saving a template is a detour from the one
           action this screen exists for, and `.btn-primary`'s `flex: 1` would
           give the detour the larger half of the dock. -->
      <button class="btn" id="saveTpl">存为模板</button>
      <button class="btn btn-primary" id="save">保存</button>
    </div>
  </aside>
</div>
<div id="app" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
