<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9E8E3">
<title>模糊画框</title>
<!--
  First paint, ahead of the stylesheet and ahead of every module: the theme
  lands on `documentElement` before the wall is painted. `src/ui/theme.ts` is a
  deferred module, so on its own it always loses that race — a visitor whose
  system prefers dark got a light wall first, and `app.css`'s .25s
  background-color transition turned the correction into a fade. Dark mode is a
  headline feature here and the wall is the material the whole design is made
  of; the first frame has to be right.

  This is the same decision `resolveTheme()` makes, on the same key
  `readStoredTheme()` reads (the two are pinned together by
  tests/unit/theme.test.ts, since a head script cannot import a module without
  becoming deferred — the defect it exists to fix). Module scripts do re-apply
  it, idempotently, once they run.
-->
<script>
(function () {
  var stored = null
  try {
    stored = localStorage.getItem('frame-app-theme')
  } catch (e) {
    /* Private modes and some webviews throw on access. The system preference
       is still a usable answer, so this must not end the script. */
  }
  try {
    var t = stored === 'light' || stored === 'dark'
      ? stored
      : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    document.documentElement.setAttribute('data-theme', t)
    document.documentElement.style.colorScheme = t
  } catch (e) {
    /* No theme: the module applies one a moment later, and the stylesheet's
       default is light. Never let this script take the page down with it. */
  }
})()
</script>
</head>
<body>
<!--
  The shell, in the order a poster is made: the photograph, the wall, the rack,
  the numbers. Three columns on a desk — photographs, wall with the styles under
  it, adjustments — and one stack on a phone, where the same four things arrive
  in the same order with the photograph list behind a button
  (`.topbar #photos-open`) rather than pinned open beside everything else.

  The phone's shape follows a camera app's own editor: 取消 · 撤销重做 · 保存
  across the top, the poster in the middle with its caption under it, then the
  collections, the rack of styles, and the row of panels (文字 / 画面) at the
  bottom. What is taken from it is the arrangement; the palette, the hairlines
  and the marks stay this app's own — see `src/styles/design` and `app.css`.
-->
<div class="app">
  <!-- 照片 — the left column: every photograph loaded this session, one row
       each, with the wall's own marked. The list is built by `src/ui/photos.ts`
       from the state, and the drop zone is pinned under it rather than above,
       so what a returning user does first (switch photograph) is at the top of
       the column and what a new user does first (add one) is the last row they
       reach. Under 901px the whole column becomes a sheet: `#photos-open` in
       the top bar toggles `body.photos-open`, and `.drop` travels with it. -->
  <aside class="photos" id="photos">
    <div class="col-h">
      <b>照片</b>
      <span id="photo-count"></span>
      <!-- The sheet's own way out. On a phone the sheet covers the button that
           opened it, so the bar's button cannot be its own close. On a desk this
           is hidden with the sheet's own sheet-ness. -->
      <button class="sheet-x" id="photos-close" type="button" aria-label="收起照片列表">×</button>
    </div>
    <div class="photo-list" id="photo-list"></div>
    <!-- `#file` is `hidden`, so this div is the only way to a photo for a
         keyboard user: it needs a tab stop and a button role, and `wireInput`
         opens the input on Enter and Space as well as on click. -->
    <div class="drop" id="drop" tabindex="0" role="button">添加照片<small>点击选择多张，也可以拖进来或粘贴</small></div>
    <!-- A sibling of `.drop`, never a child of it: `wireInput` opens this input
         from `.drop`'s own click handler, so an input nested inside the zone
         would be clicked from within the dispatch of the click it caused —
         a cycle. `multiple` because the list is a list. -->
    <input type="file" id="file" accept="image/*" multiple hidden>
  </aside>
  <!-- Tapping away closes the sheet. A sheet with one way out, and that way out
       behind the sheet, is a trap; this is the other way out. Hidden above the
       breakpoint, where there is no sheet to dismiss. -->
  <div class="scrim" id="scrim"></div>

  <main class="stage" id="stage">
    <!-- The phone's top bar — `display: none` above the breakpoint, where the
         same three things live in the columns themselves. 照片 first because on
         a phone the list is behind it and a first-time visitor has to be able to
         reach the way in; then the two arrows, then 保存, which is the action
         the screen exists for. `#save-top` and `#save` are the same handler and
         only one of them is ever on screen. -->
    <header class="topbar" id="topbar">
      <button class="btn btn-quiet" id="photos-open" aria-controls="photos" aria-expanded="false">照片<span id="photos-n"></span></button>
      <div class="hist">
        <button class="icon" id="undo" type="button" title="撤销" aria-label="撤销">↺</button>
        <button class="icon" id="redo" type="button" title="重做" aria-label="重做">↻</button>
      </div>
      <button class="btn btn-primary" id="save-top">保存</button>
    </header>

    <div class="wall" id="wall">
      <div class="wall-pane">
        <canvas id="cv"></canvas>
        <!-- The bare wall, with the one thing a new visitor needs on it. On a
             desk the drop zone is a column away and visible; on a phone the
             list is a sheet, so the empty wall carries its own way in rather
             than leaving a blank screen with a button in a drawer. Shown by
             `paintPhotos` and only under the breakpoint. -->
        <div class="wall-empty" id="wall-empty" hidden>
          <p>还没有照片</p>
          <button class="btn" id="add-photo" type="button">添加照片</button>
        </div>
        <!-- 背景 的两个答案, 用海报自己的样子: see `src/ui/modebar.ts`. Below the
             canvas rather than in the panel, because the two posters differ in *size*
             before they differ in anything else, and only a preview can say so. The
             discs inside it are revealed with a transition when 无照片 is chosen —
             which is why the element is built once and only ever synced. -->
        <div class="modebar" id="modebar"></div>
        <!-- In the pane rather than in the wall: the toast is a remark about the
             poster, and the pane's bottom edge is the poster's own — anchored
             to the wall it would land on the caption. -->
        <div class="toast" id="toast"></div>
      </div>

      <!-- The mount, named, in the poster's own margin — the reference editor's
           title block, and the one place the current style is legible in words
           rather than as a picture of a picture. `paintRail` fills both lines:
           the name, and the template's `tagline`. -->
      <div class="poster-cap" id="poster-cap">
        <b id="cap-name"></b>
        <span id="cap-tag"></span>
      </div>
    </div>

    <!-- The rack of styles, under the wall: the collections (`src/ui/tabs.ts`),
         then the chips (`src/ui/rail.ts`), then the premium plaque. The styles
         sit below the poster rather than in a side column because choosing one
         is a judgement about what is on the wall, and a strip of previews reads
         left-to-right as alternatives to the thing directly above them. -->
    <div class="styles" id="styles">
      <div class="rail-h"><b>样式</b><span id="rail-info"></span></div>
      <!-- One button per collection, drawn by `renderTabs`. Named in words,
           because a tab is a word — unlike the chips below it. -->
      <div class="tabs" id="tabs" role="group" aria-label="样式分类"></div>
      <!-- One chip per style, each a small render of the poster that style
           makes of the photograph in hand (see `src/ui/rail.ts`). -->
      <div class="rail" id="rail"></div>
      <!-- The premium plaque (spec §10): it names the pack when a template is
           premium *and* locked, and v1 ships nothing gated, so it is wired and
           never shown. It carries its own `hidden` rather than being created on
           demand: the picker writes two properties on an element that is always
           in the DOM, which is testable, where an element that appears and
           disappears is only observable while it is there. -->
      <div class="plaque-row" id="plaque" hidden></div>
    </div>
  </main>

  <aside class="dock" id="dock">
    <!-- 保存 first: it is the action this whole screen exists for, and the top
         right corner is where it is looked for. 存为模板 used to ride beside it
         and now lives in the 画面 panel, with the numbers it actually keeps. -->
    <div class="acts">
      <!-- The two arrows, in the dock's top row on a desk and in the top bar on
           a phone (`#undo`/`#redo` there) — the same two controls in the two
           arrangements, exactly as 保存 is. One handler each and one place that
           decides whether they are live (`paintHistory`), so the pair on screen
           cannot disagree with the pair that is not. -->
      <div class="hist">
        <button class="icon" id="undo-desk" type="button" title="撤销" aria-label="撤销">↺</button>
        <button class="icon" id="redo-desk" type="button" title="重做" aria-label="重做">↻</button>
      </div>
      <button class="btn btn-primary" id="save">保存</button>
    </div>

    <!-- The panel switch (`src/ui/modes.ts`): which of 文字 and 画面 the screen is
         showing. One at a time, because the two are questions about the same
         poster and a phone has room for one answer. On a phone this row sits at
         the foot of the stack with the open panel above it; on a desk it is the
         top of the right column, under 保存. -->
    <div class="modes" id="modes" role="group" aria-label="调整面板"></div>

    <!-- 记录级的两个动作 —— 重置与存为模板管的是**整个记录**（画框 + 文字排版），
         不是画框一块，所以它们不归任何一个面板，也就不会被"一次只显示一块"藏起来：
         在文字面板里改完字号，重置必须在手边。已调整 由这一行自己的 `data-adjusted`
         驱动（见 `paintAdjusted`），`app.css` 只认那个属性。 -->
    <div class="record-acts" id="record-acts" data-adjusted="false">
      <span class="ctl-note">已调整</span>
      <button class="btn btn-small" id="mount-reset" type="button" title="回到这个样式原本的数字">重置</button>
      <button class="btn btn-small" id="saveTpl" type="button">存为模板</button>
    </div>
    <!-- The font file picker, `hidden` and opened by the 文字 panel's ＋ button:
         which slot the font is for is known there, so the button carries it and
         this element stays a plain input the browser can drive. In the dock
         rather than in `.photos`, where the other input lives: a photo is a
         document and a font is part of the poster's typography. -->
    <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" hidden>

    <div class="panels" id="panels" data-mode="frame">
      <!-- 文字 — one input per slot the current template prints (see
           `src/ui/fields.ts`). The row is built by the picker, not written here,
           because which slots exist is a property of the template: 留白 has no
           typography, and a field for a slot nothing draws is a control that
           accepts typing and changes nothing. The whole block, heading included,
           hides at zero fields — and it carries its own `[hidden]` rule in
           `app.css` for the same reason `.plaque-row` does: the block sets its
           own `display`, which would otherwise beat the UA's `[hidden]`. -->
      <div class="fields" id="fields" hidden>
        <div class="rail-h"><b>文字</b></div>
        <div class="field-row" id="field-row"></div>
      </div>

      <!-- 画面 — the mount's own geometry: one choice (背景: is the photograph in
           the background or not) above one slider per number this template can
           change (see `src/ui/controls.ts`). Same construction and the same rule
           as 文字: the rows are the template's, not a fixed board, so 无照片 gets a
           底色 row and no 后景 rows rather than sliders that move nothing. Its two
           actions used to live in this heading; they are in the row above now, with
           the words' typography as well as these numbers. The block sets its own
           `display`, so it needs its own `[hidden]` rule for the reason `.fields`
           and `.plaque-row` do. -->
      <div class="controls" id="controls">
        <div class="rail-h"><b>画面</b></div>
        <div class="ctl-row" id="control-row"></div>
      </div>
    </div>
  </aside>
</div>
<div id="app" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
